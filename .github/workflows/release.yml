name: release
# Tag `vX.Y.Z` (matching dsh/packages/dsh/package.json) -> build the soulnet
# binaries for the five platforms, publish the five platform packages and then
# the plugin to npm, attach soulnet + soulnet-relay binaries (+ SHA256SUMS) to a
# GitHub Release. Secrets: NPM_TOKEN (automation token of the @startupworld-ai
# org). Optional repository variable NPM_PROVENANCE=true adds npm provenance
# (needs the public GitHub repo to match package.json "repository").
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack everything but do not publish or release'
        type: boolean
        default: true
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: dsh/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: dsh/pnpm-lock.yaml
      - name: check tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p "require('./dsh/packages/dsh/package.json').version")"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match dsh/packages/dsh version $version" >&2
            exit 1
          fi
          for dir in dsh/packages/soulnet-*; do
            v="$(node -p "require('./$dir/package.json').version")"
            if [ "$v" != "$version" ]; then echo "$dir is $v, plugin is $version" >&2; exit 1; fi
          done
      - run: go test ./...
      - name: build soulnet for the five platform packages + release assets
        run: node dsh/scripts/build-peer-packages.mjs --assets dsh/dist/release
      - name: build and test the plugin
        working-directory: dsh
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm run typecheck
          pnpm run test:unit
      - name: pack everything (dry-run artefact)
        working-directory: dsh
        run: pnpm run pack:all
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs-and-binaries
          path: |
            dsh/dist/*.tgz
            dsh/dist/release/*
      - name: publish the five platform packages, then the plugin
        if: env.DRY_RUN != 'true'
        working-directory: dsh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: ${{ vars.NPM_PROVENANCE == 'true' && 'true' || 'false' }}
        run: |
          for dir in packages/soulnet-win32-x64 packages/soulnet-darwin-arm64 packages/soulnet-darwin-x64 packages/soulnet-linux-x64 packages/soulnet-linux-arm64 packages/dsh; do
            name=$(node -p "require('./$dir/package.json').name")
            ver=$(node -p "require('./$dir/package.json').version")
            # Idempotent: releases are sometimes published by hand first and the
            # tag pushed afterwards - an already-published exact version is a
            # skip, not a failure.
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "skip $name@$ver (already on the registry)"
              continue
            fi
            echo "::group::publish $dir"
            (cd "$dir" && pnpm publish --access public --no-git-checks)
            echo "::endgroup::"
          done
      - name: GitHub Release with the binaries
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dsh/dist/release/*
          generate_release_notes: true
